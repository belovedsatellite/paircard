<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIDE A/B 카드 스튜디오</title>
<meta name="description" content="SIDE A/B 카드 템플릿에 이미지와 글자를 넣어 PNG·GIF로 저장하는 도구">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">SIDE A/B 카드 스튜디오</div>
    <div id="saveStatus" class="save-status" title="입력 내용은 이 브라우저에 자동으로 임시 저장됩니다"></div>
    <div class="top-actions">
      <button id="btnTopPng" class="btn">PNG 저장</button>
      <button id="btnTopGif" class="btn primary">GIF 저장</button>
    </div>
  </header>

  <aside id="sidebar">
    <nav id="tabs" role="tablist"></nav>
    <div id="panel"></div>
  </aside>

  <main id="stage">
    <div id="previewWrap">
      <canvas id="preview" width="1920" height="1080"></canvas>
    </div>
    <section id="timeline"></section>
  </main>
</div>

<div id="overlay" hidden>
  <div class="modal">
    <div id="overlayTitle" class="modal-title">GIF 만드는 중</div>
    <div class="progress"><div id="overlayBar"></div></div>
    <div id="overlayText" class="modal-text"></div>
    <button id="overlayCancel" class="btn">취소</button>
  </div>
</div>
<div id="toast" hidden></div>
<input type="file" id="filePicker" hidden>

<script src="js/gifenc.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
